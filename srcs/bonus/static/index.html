<!doctype html>
<html data-theme="dark">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
			
		<link rel="icon" href="./ressources/favicon.ico">

		<title>Hello! I'm Cartoone</title>

		<style>

		/* --- background --- */
		.animated-bg {
			position: relative;
		}

		.animated-bg::before {
			content: "";
			position: fixed;
			inset: 0;
			background: radial-gradient(circle at 8% 60%, #1d4ed8, #0f172a, #c026d3, #0f172a, #2dd4bf, #0f172a, #1d4ed8, #0f172a, #c026d3, #c026d3);
			background-size: 1500% 1500%;
			animation: gradient 220s linear infinite;
			opacity: 0.8;
			z-index: -1;
		}

		@keyframes gradient {
		0% { background-position: 0% 50%; }
		50% { background-position: 100% 50%; }
		100% { background-position: 0% 50%; }
		}

		/* --- swap word --- */
		.swap-word {
			position: relative;
			display: inline-block;
		}

		.swap-word .word-default,
		.swap-word .word-hover {
			transition: opacity 0.5s ease, filter 0.5s ease;
		}

		.swap-word .word-hover {
			top: 0;
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
			opacity: 0;
			filter: blur(8px);
			white-space: nowrap;
		}

		.swap-word:hover .word-default {
			opacity: 0;
			filter: blur(8px);
		}

		.swap-word:hover .word-hover {
			opacity: 1;
			filter: blur(0);
		}

		/* --- button glow --- */
		.github-glow:hover figure {
			box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
		}

		.behance-glow:hover figure {
			box-shadow: 0 0 15px rgba(24, 119, 242, 0.5);
		}

		</style>
	</head>
