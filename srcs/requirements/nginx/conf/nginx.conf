events {} # Keep defaults

http {

	# Useful for files informations based on
	# the file extension, like .jpg, otherwise
	# we might need to inspect bytes and guess,
	# which is less precise and less secure
	include /etc/nginx/mime.types;

	server {

		listen 443 ssl http2; # IPv4
		listen [::]:443 ssl http2; # IPv6

		server_name user.42.fr;

		ssl_certificate     /etc/nginx/ssl/inception.crt;
		ssl_certificate_key /etc/nginx/ssl/inception.key;
		ssl_protocols       TLSv1.2 TLSv1.3;

		root    /var/www/wordpress;
		index	index.php index.html index.htm;

		location / {
			try_files $uri $uri/ /index.php?$args;
		}

		location ~ \.php$ {
			fastcgi_pass wp_php:9000;
			fastcgi_index index.php;
			include /etc/nginx/fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}

		location /adminer {
			fastcgi_pass adminer:9000;
			fastcgi_index index.php;
			include /etc/nginx/fastcgi_params;
			fastcgi_param SCRIPT_FILENAME /var/www/adminer/index.php;
		}
		
		location /static {
			root /var/www/;
			try_files $uri $uri/ =404;
		}
	}
}
